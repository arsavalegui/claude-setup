<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Mando</title>
<style>
  :root { --bg:#0b0e14; --panel:#131826; --line:#2a3242; --text:#e6e9ef; --muted:#7c8597;
          --idle:#3a4152; --on:#22c55e; --wait:#f59e0b; --core:#60a5fa; --adhoc:#a78bfa; }
  * { box-sizing:border-box }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
              font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden }
  header { position:fixed; inset:0 0 auto 0; display:flex; gap:18px; align-items:center;
           padding:10px 18px; background:linear-gradient(var(--bg), transparent); z-index:2 }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.3px }
  header .meta { color:var(--muted); font-size:12px; display:flex; gap:14px; align-items:center }
  header a { color:var(--core); text-decoration:none }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; margin-right:6px }
  .dot.ok { background:var(--on) }
  svg { width:100vw; height:100vh; display:block }
  line.link { stroke:var(--line); stroke-width:1.5 }
  line.link.on { stroke:var(--on); stroke-opacity:.6 }
  circle.halo { fill:none; stroke-width:2; opacity:0 }
  .on circle.halo { opacity:1; animation:pulse 1.6s ease-out infinite }
  @keyframes pulse { 0%{ r:34; opacity:.9 } 100%{ r:56; opacity:0 } }
  circle.body { fill:var(--panel); stroke:var(--idle); stroke-width:2 }
  .on circle.body { stroke:var(--on) }
  .wait circle.body { stroke:var(--wait) }
  .core circle.body { stroke:var(--core); stroke-opacity:.5 }
  .core.on circle.body { stroke:var(--core); stroke-opacity:1 }
  .core circle.halo { stroke:var(--core) }
  .roster circle.halo { stroke:var(--on) }
  .adhoc circle.body { stroke:var(--adhoc); stroke-dasharray:4 3 }
  .adhoc circle.halo { stroke:var(--adhoc) }
  text { fill:var(--text); text-anchor:middle; pointer-events:none }
  text.name { font-size:13px; font-weight:600 }
  text.legend { font-size:11px; fill:var(--muted) }
  .on text.legend { fill:var(--text) }
  text.icon { font-size:20px }
  .standby { opacity:.45 }
  .standby text.name { fill:var(--muted) }
  g.node { transition:opacity .4s }
  #tip { position:fixed; display:none; max-width:360px; background:var(--panel); border:1px solid var(--line);
         border-radius:8px; padding:10px 12px; font-size:12px; color:var(--muted); pointer-events:none; z-index:3 }
  #tip b { color:var(--text); display:block; margin-bottom:4px }
  footer { position:fixed; bottom:10px; left:18px; color:var(--muted); font-size:11px }
</style>
</head>
<body>
<header>
  <h1>Centro de Mando</h1>
  <div class="meta">
    <span><span class="dot" id="conn"></span><span id="connTxt">conectando…</span></span>
    <span id="sess">0 sesiones</span>
    <span id="activos">0 activos</span>
    <a href="http://127.0.0.1:3001" target="_blank">agent-flow ↗</a>
  </div>
</header>
<svg id="g" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="tip"></div>
<footer>gris = en standby · verde = trabajando · punteado = agente temporal · pasa el mouse para ver la descripción</footer>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('g');
  const tip = document.getElementById('tip');
  const ICONS = { claude:'🧠', desarrollador:'🛠️', tester:'🧪', revisor:'🔍', investigador:'🌐',
                  'n8n-especialista':'🔗', 'agente-datos':'🗄️', 'editor-videos':'🎬',
                  operador:'🖥️', documentador:'📝', integraciones:'🔌' };
  let state = null, skew = 0;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function hace(ts) {
    if (!ts) return 'sin actividad aún';
    const s = Math.max(0, Date.now() / 1000 - skew - ts);
    if (s < 60) return 'hace un momento';
    if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';
    return 'hace ' + Math.round(s / 86400) + ' d';
  }
  function legend(a) {
    if (a.status === 'activo') return 'paso ' + a.steps + ' · ' + (a.step || a.tool || 'trabajando');
    return 'en standby · ' + hace(a.last_active);
  }
  function render() {
    if (!state) return;
    const W = innerWidth, H = innerHeight, cx = W / 2, cy = H / 2 + 10;
    const core = state.agents.find(a => a.kind === 'core');
    const roster = state.agents.filter(a => a.kind === 'roster');
    const adhoc = state.agents.filter(a => a.kind === 'adhoc');
    const R = Math.min(W, H) * 0.34, R2 = R * 1.55;
    svg.innerHTML = '';
    const links = el('g', {}, svg), nodes = el('g', {}, svg);
    const place = (list, r, offset) => list.map((a, i) => {
      const ang = -Math.PI / 2 + offset + (2 * Math.PI * i) / Math.max(list.length, 1);
      return { a, x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang) };
    });
    const pts = place(roster, R, 0).concat(place(adhoc, R2, Math.PI / 7));
    for (const p of pts) el('line', { class: 'link' + (p.a.status === 'activo' ? ' on' : ''), x1: cx, y1: cy, x2: p.x, y2: p.y }, links);
    pts.push({ a: core, x: cx, y: cy });
    for (const p of pts) {
      const a = p.a;
      const cls = ['node', a.kind, a.status === 'activo' ? 'on' : 'standby'];
      if (/aviso|permiso/.test(a.step) && a.status === 'activo') cls.push('wait');
      const g = el('g', { class: cls.join(' '), transform: 'translate(' + p.x + ',' + p.y + ')' }, nodes);
      el('circle', { class: 'halo', r: 34 }, g);
      el('circle', { class: 'body', r: a.kind === 'core' ? 40 : 34 }, g);
      el('text', { class: 'icon', y: 7 }, g).textContent = ICONS[a.id] || (a.kind === 'adhoc' ? '✨' : '🤖');
      el('text', { class: 'name', y: (a.kind === 'core' ? 40 : 34) + 18 }, g).textContent = a.name;
      const t = el('text', { class: 'legend', y: (a.kind === 'core' ? 40 : 34) + 34 }, g);
      t.textContent = legend(a);
      t.dataset.id = a.id;
      g.addEventListener('mousemove', ev => {
        tip.style.display = 'block'; tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
        // textContent siempre: step/desc vienen de tool_input de los hooks, texto no confiable
        tip.replaceChildren();
        const b = document.createElement('b'); b.textContent = a.name; tip.appendChild(b);
        const lines = [a.desc || '', '', legend(a)];
        if (a.active_ids > 1) lines.push(a.active_ids + ' instancias a la vez');
        lines.forEach(l => { tip.appendChild(document.createTextNode(l)); tip.appendChild(document.createElement('br')); });
      });
      g.addEventListener('mouseleave', () => tip.style.display = 'none');
    }
    document.getElementById('sess').textContent = state.sessions + (state.sessions === 1 ? ' sesión' : ' sesiones');
    const n = state.agents.filter(a => a.status === 'activo' && a.kind !== 'core').length;
    document.getElementById('activos').textContent = n + (n === 1 ? ' agente activo' : ' agentes activos');
  }
  function refreshLegends() {
    if (!state) return;
    for (const t of svg.querySelectorAll('text.legend')) {
      const a = state.agents.find(x => x.id === t.dataset.id);
      if (a) t.textContent = legend(a);
    }
  }
  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => { document.getElementById('conn').className = 'dot ok'; document.getElementById('connTxt').textContent = 'en vivo'; };
    es.onmessage = ev => { state = JSON.parse(ev.data); skew = Date.now() / 1000 - state.now; render(); };
    es.onerror = () => { document.getElementById('conn').className = 'dot'; document.getElementById('connTxt').textContent = 'reconectando…'; };
  }
  addEventListener('resize', render);
  setInterval(refreshLegends, 10000);
  connect();
})();
</script>
</body>
</html>
